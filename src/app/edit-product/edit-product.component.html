<!-- Container -->
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-lg-7 shadow-sm p-5 bg-white rounded" style="max-width: 700px;">
      <h3 class="mb-4 fw-bold">Edit Product</h3>

      <form #productCatlogForm="ngForm" (ngSubmit)="saveCatlog()">

        <!-- Product Name and Status Toggle -->
        <div class="row mb-4">
          <div class="col-md-8">
            <label for="productOfferDescription" class="form-label fw-semibold">Product Name <span
                class="text-danger">*</span></label>
            <ng-select [items]="focusProducts" bindLabel="sName" bindValue="iMasterId"
              [(ngModel)]="currentCatlog.focusProductId" [multiple]="true" name="focusProductId"
              placeholder="Select Product Name" [searchable]="true" [clearable]="true" required
              (ngModelChange)="onProductChange($event)">
            </ng-select>

            <div *ngIf="submitted && !currentCatlog.focusProductId" class="text-danger mt-1 small fst-italic">
              Product Name is required.
            </div>

          </div>

          <div class="col-md-4 d-flex flex-column align-items-start mt-3 mt-md-0">
            <label class="fw-semibold mb-2" for="productOfferStatus">Status <span class="text-danger">*</span></label>
            <div class="form-check form-switch form-switch-lg">
              <input class="form-check-input" type="checkbox" id="productOfferStatus"
                [checked]="currentCatlog.productOfferStatus === 'Active'" (change)="toggleStatus($event)" />
              <label class="form-check-label" for="productOfferStatus"></label>
            </div>
          </div>
        </div>

        <!-- Product Category -->
        <div class="row mb-4">
          <div class="col-md-12">
            <label for="productCategory" class="form-label fw-semibold">Product Category <span class="text-danger">*</span></label>
            <ng-select
              [items]="productCategories"
              bindLabel="name"
              bindValue="_id"
              [(ngModel)]="currentCatlog.productCategory"
              name="productCategory"
              placeholder="Select a category"
              [multiple]="false"
              [clearable]="false"
              [searchable]="true"
              required>
            </ng-select>
            <div *ngIf="submitted && !currentCatlog.productCategory" class="text-danger mt-1 small fst-italic">
              Product category is required.
            </div>
          </div>
        </div>

        <!-- Product Image -->
        <div class="mb-4">
          <label for="productOfferImage" class="form-label fw-semibold">Product Image <span
              class="text-danger">*</span></label>
          <input type="file" id="productOfferImage" class="form-control form-control-lg shadow-sm"
            (change)="handleImageChange($event)" accept="image/*" />
          <div *ngIf="currentCatlog.productOfferImageUrl" class="mt-3">
            <img [src]="currentCatlog.productOfferImageUrl" alt="Product Image"
              class="img-thumbnail shadow-sm" style="max-width: 150px; max-height: 150px; border-radius: 8px;" />
          </div>
          <div *ngIf="submitted && !currentCatlog.productOfferImage && !currentCatlog.productOfferImageUrl"
            class="text-danger mt-1 small fst-italic">
            Product image is required.
          </div>
        </div>

        <!-- Price Groups -->
        <div *ngFor="let priceGroup of priceList; let i = index" class="mb-4 p-4 border rounded shadow-sm bg-light">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <!-- Volume as Dropdown -->
            <div class="mb-3" style="width: 200px;">
              <label class="form-label fw-semibold">Volume</label>
              <select class="form-select" [(ngModel)]="priceList[i].volume" name="volume_{{i}}" required>
                <option value="" disabled>Select Volume</option>
               <option value="10ML">10ML</option>
                <option value="50ML">50ML</option>
                <option value="100ML">100ML</option>
                <option value="200ML">200ML</option>
                <option value="500ML">500ML</option>
                <option value="950ML">950ML</option>
                <option value="1LTR">1L</option>
                <option value="3.8LTR">3.8L</option>
                <option value="4LTR">4L</option>
                <option value="9.5LTR">9.5L</option>
                <option value="10LTR">10L</option>
                <option value="15LTR">15L</option>
                <option value="19LTR">19L</option>
                <option value="20LTR">20L</option>
                <option value="25LTR">25L</option>
                <option value="30LTR">30L</option>
                <option value="35LTR">35L</option>
                <option value="40LTR">40L</option>
                <option value="45LTR">45L</option>
                <option value="50LTR">50L</option>
                <option value="1KG">1KG</option>
                <option value="2KG">2KG</option>
                <option value="5KG">5KG</option>
                <option value="10KG">10KG</option>
                <option value="20KG">20KG</option>
                <option value="25KG">25KG</option>
                <option value="30KG">30KG</option>
                <option value="35KG">35KG</option>
                <option value="40KG">40KG</option>
                <option value="50KG">50KG</option>

              </select>
            </div>
            <button class="btn btn-sm btn-outline-danger" type="button" (click)="priceList.splice(i, 1)">−</button>
          </div>

          <!-- Entries -->
          <div *ngFor="let entry of priceGroup.entries; let j = index" class="row align-items-end g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Place</label>
              <ng-select [items]="groupedDropdownData" bindLabel="label" bindValue="id" groupBy="group"
                [(ngModel)]="entry.selectedKey" name="entry_selectedKey_{{ i }}_{{ j }}"
                placeholder="Select State/Zone/District" [clearable]="false" [searchable]="true"
                [dropdownPosition]="'auto'">
              </ng-select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Price</label>
              <input type="number" class="form-control" [(ngModel)]="priceList[i].entries[j].price"
                name="price{{i}}{{j}}" placeholder="Enter price" required min="0" />
            </div>
            <div class="col-md-2 d-flex gap-2">
              <!-- Add entry only on last row -->
              <button *ngIf="j === priceGroup.entries.length - 1" type="button" class="btn btn-outline-primary w-50"
                (click)="addEntryToVolume(i)">+</button>

              <!-- Remove entry if more than 1 -->
              <button type="button" class="btn btn-outline-danger w-50" (click)="removeEntryFromVolume(i, j)"
                [disabled]="priceGroup.entries.length === 1">−</button>
            </div>
          </div>
        </div>

        <!-- Add Volume -->
        <div class="mb-4 d-flex justify-content-end">
          <button type="button" class="btn btn-outline-success" (click)="addPrice()">+ Add Volume</button>
        </div>

        <!-- Error Messages -->
        <div *ngIf="errorArray.length" class="alert alert-danger shadow-sm">
          <ul class="mb-0">
            <li *ngFor="let error of errorArray">{{ error }}</li>
          </ul>
        </div>

        <!-- Action Buttons -->
        <div class="d-flex justify-content-end gap-3">
          <button type="button" class="btn btn-outline-secondary px-4" (click)="cancel()">Cancel</button>
          <button type="submit" class="btn btn-primary px-4">Update Product</button>
        </div>

      </form>
    </div>
  </div>
</div>
